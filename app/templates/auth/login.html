{% extends "base.html" %}


{% block title %}
Login - Nova Adega
{% endblock %}


<!-- =========================
     ESCONDER NAVBAR NO LOGIN
========================= -->

{% block navbar %}{% endblock %}


<!-- =========================
     ESCONDER FOOTER DO BASE
========================= -->

{% block footer %}{% endblock %}


<!-- =========================
     CSS DO LOGIN
========================= -->

{% block styles %}

<link
    rel="stylesheet"
    href="/static/css/login.css"
>


<!-- Font Awesome -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

{% endblock %}


<!-- =========================
     CONTEÚDO DO LOGIN
========================= -->

{% block content %}

<main class="login-page">

    <div class="login-card">


        <!-- ÍCONE -->

        <div class="logo">

            <i class="fa-solid fa-wine-glass"></i>

        </div>


        <!-- TÍTULO -->

        <h1>
            Bem-vindo
        </h1>


        <p>
            Sistema PDV - Adega
        </p>


        <!-- FORMULÁRIO -->

        <form method="POST">


            <!-- E-MAIL -->

            <label for="email">
                E-mail ou Usuário
            </label>


            <div class="input-group">

                <i class="fa-regular fa-envelope"></i>

                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- SENHA -->

            <label for="senha">
                Senha
            </label>


            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- BOTÃO -->

            <button type="submit">
                Entrar
            </button>


        </form>


        <!-- RODAPÉ DO CARD -->

        <div class="login-footer">
            Sistema de Ponto de Venda v1.0
        </div>


    </div>

</main>

{% endblock %}
