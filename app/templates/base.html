<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Nova Adega{% endblock %}
    </title>


    <!-- CSS PRINCIPAL -->

    <link
        rel="stylesheet"
        href="/static/CSS/home.css"
    >


    <!-- CSS ESPECÍFICO DE CADA PÁGINA -->

    {% block styles %}{% endblock %}

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">


    <!-- LOGO -->

    <div class="logo">

        <a href="/">

            🍷 Nova Adega

        </a>

    </div>



    <!-- MENU -->

    <div class="menu">

        <a href="/pdv/">
            PDV
        </a>


        <a href="/movimentacoes/">
            Histórico
        </a>


        <a href="/produtos/">
            Produtos
        </a>


        <a href="/categorias/">
            Categorias
        </a>


        <a
            href="/auth/logout"
            class="btn-sair"
        >
            Sair
        </a>

    </div>


</nav>



<!-- =========================
     CONTEÚDO DA PÁGINA
========================= -->

{% block content %}{% endblock %}



<!-- JAVASCRIPT -->

{% block scripts %}{% endblock %}


</body>

</html>
