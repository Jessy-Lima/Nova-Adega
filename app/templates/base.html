<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Nova Adega{% endblock %}</title>

    <link rel="stylesheet" href="/static/CSS/home.css?v=3">

    <!-- CSS específico da página -->
    {% block styles %}{% endblock %}

    <link rel="stylesheet" href="/static/CSS/voltar.css?v=1">
    
</head>

<body>
    <!-- Menu compartilhado por todas as páginas -->
    {% block navbar %}
    <header class="navbar">
        <div class="logo">

            <a href="/">
                🍷 Nova Adega
            </a>

        </div>


        <div class="menu">

            <a href="/pdv/">
                PDV
            </a>

            <a href="/pdv/historico/">
                Histórico
            </a>

            <a href="/produtos/">
                Produtos
            </a>

            <a href="/categorias/">
                Categorias
            </a>

            <a href="/clientes/">
                Clientes
            </a>

            <a href="/auth/logout" class="btn-sair">
                Sair
            </a>

        </div>
    </header>
    {% endblock %}

    <!-- Conteúdo específico de cada página -->
    <main class="page-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé compartilhado -->
    {% block footer %}
    <footer class="footer">
        <p>© 2026 <strong>AdegaPremium</strong> · @novaadega</p>
    </footer>
    {% endblock %}




    <!-- =========================
         JAVASCRIPT
    ========================= -->


    <!-- JavaScript específico da página -->

    {% block scripts %}{% endblock %}
</body>

</html>
