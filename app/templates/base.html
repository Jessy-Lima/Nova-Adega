<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Nova Adega{% endblock %}
    </title>


    <!-- =========================
         CSS PRINCIPAL
    ========================= -->

    <link
        rel="stylesheet"
        href="/static/CSS/home.css?v=2"
    >


    <!-- =========================
         CSS ESPECÍFICO DA PÁGINA
    ========================= -->

    {% block styles %}{% endblock %}

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    {% block navbar %}

    <nav class="navbar">

        <div class="logo">

            <a href="/">
                🍷 Nova Adega
            </a>

        </div>


        <div class="menu">

            <a href="/pdv/">
                Home
            </a>

            <a href="/movimentacoes/">
                Histórico
            </a>

            <a href="/produtos/">
                Produtos
            </a>

            <a href="/categorias/">
                Categorias
            </a>

            <a href="/clientes/">
                Clientes
            </a>

            <a
                href="/auth/logout"
                class="btn-sair"
            >
                Sair
            </a>

        </div>

    </nav>

    {% endblock %}


    <!-- =========================
         ÁREA PRINCIPAL
    ========================= -->

    <div class="page-wrapper">

        {% block content %}{% endblock %}

    </div>


    <!-- =========================
         FOOTER
    ========================= -->

    {% block footer %}

    <footer class="footer">

        <p>
            © 2026 <strong>AdegaPremium</strong> · @novaadega
        </p>

    </footer>

    {% endblock %}


    

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    {% block scripts %}{% endblock %}


</body>

</html>
